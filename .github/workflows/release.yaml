name: release

# Publishes a GitHub Release for a version tag (v*). It runs when the tag is
# pushed, when a release is published from the GitHub interface (which
# creates the tag), or manually from main (Actions > release > Run workflow),
# in which case the tag v<Version> is created on the current commit. The tag must match the Version field of
# DESCRIPTION and the source tarball is attached (an existing release is
# updated). Release notes written on GitHub are kept; only a release without
# notes gets the NEWS.md section of that version.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pak from the package repository: downloads from r-lib.github.io
          # timed out or returned 503 on several runs (2026-11-04).
          pak-version: repo
          extra-packages: any::rcmdcheck
          needs: check
      - name: Tag matches DESCRIPTION version
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          version=$(Rscript -e 'cat(read.dcf("DESCRIPTION", "Version"))')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${GITHUB_REF_NAME}" = "main" || {
              echo "Manual releases run only from main"; exit 1; }
            tag="v${version}"
          fi
          test "v${version}" = "${tag}" || {
            echo "Tag ${tag} does not match Version ${version}"; exit 1; }
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build and check the source package
        run: |
          R CMD build .
          R CMD check --no-manual "EarthFlux_${VERSION}.tar.gz"
      - name: Release notes (kept if written on GitHub, else from NEWS.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only a missing release (HTTP 404) or an empty body falls back to
          # NEWS.md; any other lookup failure stops the job so that notes
          # written on GitHub are never overwritten.
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.body // ""' 2> lookup-error.txt); then
            :
          elif grep -q "HTTP 404" lookup-error.txt; then
            existing=""
          else
            cat lookup-error.txt
            echo "Could not look up the release ${TAG}; re-run the job"
            exit 1
          fi
          if [ -n "$(printf '%s' "${existing}" | tr -d '[:space:]')" ]; then
            echo "Keeping the release notes written on GitHub"
            printf '%s\n' "${existing}" > release-notes.md
          else
            echo "Release notes from the NEWS.md section of ${VERSION}"
            awk -v v="# EarthFlux ${VERSION}" '
              index($0, v) == 1 {on = 1; next}
              on && /^# EarthFlux / {exit}
              on {print}' NEWS.md > release-notes.md
          fi
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: EarthFlux ${{ env.VERSION }}
          body_path: release-notes.md
          files: EarthFlux_${{ env.VERSION }}.tar.gz
