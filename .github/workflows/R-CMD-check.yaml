# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# macOS runs on pushes to main, weekly and on demand, but not on pull
# requests: hosted macOS arm64 runners are often unavailable for minutes to
# hours, which blocked merges without any failure of the package
# (dev/DEVELOPMENT.md section 2.5). The release checklist requires a green
# macOS run on main (dev/RELEASING.md).
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]' || '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pak from the package repository: downloads from r-lib.github.io
          # timed out or returned 503 on several runs (2026-11-04).
          pak-version: repo
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Oldest supported terra. DESCRIPTION requires terra (>= 1.7-65); the
  # return shapes of terra::metags() and terra::gdal(lib = "all") changed in
  # 1.8-42 and 1.9-46, and the jobs above only ever see the latest terra,
  # so a regression on the declared minimum would otherwise go unnoticed
  # (NEWS.md, 0.1.0.9000). R 4.3 is the R on which 1.7-65 was verified.
  # When the minimum in DESCRIPTION is raised, update `terra@` below.
  # Pinned to ubuntu-24.04 (GDAL 3.8): terra 1.7-65 does not compile against
  # GDAL 3.12 of ubuntu-latest (26.04), where OGRLayer::GetSpatialRef()
  # returns a const pointer.
  min-terra:
    runs-on: ubuntu-24.04

    name: ubuntu-24.04 (R 4.3, terra 1.7-65)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: repo
          extra-packages: any::rcmdcheck
          needs: check

      # Installed on its own, after the other dependencies: as a pak ref
      # (terra@1.7-65) its Suggests are resolved too, and leaflet -> raster
      # requires terra (>= 1.8-5), so the solver refuses the pinned version.
      - name: Install the minimum terra from the CRAN archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev
          Rscript -e 'install.packages("https://cloud.r-project.org/src/contrib/Archive/terra/terra_1.7-65.tar.gz", repos = NULL, type = "source")'

      - name: Confirm the installed terra is the declared minimum
        run: |
          v <- as.character(utils::packageVersion("terra"))
          cat("terra", v, "\n")
          if (v != "1.7.65") stop("expected terra 1.7-65, got ", v)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
