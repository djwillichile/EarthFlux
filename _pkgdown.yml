url: https://djwillichile.github.io/EarthFlux/

template:
  bootstrap: 5
  bslib:
    primary: "#003B46"
    link-color: "#00606F"

authors:
  Guillermo Servando Fuentes-Jaque:
    href: https://github.com/djwillichile

articles:
  - title: Getting started
    contents:
      - earthflux-introduction
      - articles/cauquenes-example
  - title: Development
    contents:
      - articles/design

reference:
  - title: Workflow
    desc: >
      Actual evapotranspiration of an area and a date in one call: automatic
      MODIS surface state and elevation model, weather from stations or ERA5
      (Open-Meteo), and the METRIC chain with a named, documented preset that
      sets every scientific option.
    contents:
      - earthflux
      - ef_presets
      - ef_preset
  - title: METRIC
    desc: Physics core of the METRIC surface energy balance.
  - subtitle: Radiation components
    desc: >
      Solar geometry, shortwave transmissivity, incoming shortwave and
      longwave radiation and longwave radiation emitted by the surface: the
      inputs of the net radiation.
    contents:
      - ef_solar_geometry
      - ef_tau_sw
      - ef_rs_in
      - ef_atm_emissivity
      - ef_rl_in
      - ef_rl_out
  - subtitle: Net radiation
    contents:
      - ef_net_radiation
  - subtitle: Soil heat flux
    contents:
      - ef_g
  - subtitle: Anchor pixels
    contents:
      - ef_select_anchors
      - ef_anchors
      - ef_anchor_criteria
      - ef_anchor_rule
      - ef_homogeneity
      - ef_anchor_pick
      - ef_anchor_conditions
  - subtitle: Aerodynamics and sensible heat
    desc: >
      Momentum roughness, wind at the blending height, friction velocity,
      aerodynamic resistance, air density, dT calibration from the anchor
      pixels and sensible heat flux.
    contents:
      - ef_zom
      - ef_blending_wind
      - ef_ustar
      - ef_rah
      - ef_air_density
      - ef_ts_datum
      - ef_dt_coef
      - ef_sensible_heat
      - ef_h_control
      - ef_calibrate_h
  - subtitle: Latent heat and evapotranspiration
    contents:
      - ef_latent_heat
      - ef_et_inst
      - ef_etrf
      - ef_et_daily
  - title: Meteorological forcing
    desc: >
      Meteorological forcing of the METRIC chain from weather stations: the
      standard station table and its quality control, the variables derived
      from the observations and the reference evapotranspiration (grass ETo
      of FAO-56, alfalfa ETr of the ASCE-EWRI standardized equation).
  - subtitle: Station data and quality control
    desc: >
      Standard table of station metadata and observations (UTC timestamps,
      contract units, provenance) and its quality control, which flags
      records without modifying them.
    contents:
      - ef_station_table
      - ef_station_qc
  - subtitle: Derived variables
    desc: >
      Psychrometric constant, saturation and actual vapour pressure, dew
      point, wind speed at 2 m, extraterrestrial and clear-sky radiation
      (FAO-56).
    contents:
      - ef_psychrometric
      - ef_es
      - ef_es_slope
      - ef_ea
      - ef_dewpoint
      - ef_wind_2m
      - ef_ra_daily
      - ef_ra_period
      - ef_rso
  - subtitle: Reference evapotranspiration
    desc: >
      Net radiation and soil heat flux of the reference surface and the
      reference evapotranspiration, with explicit reference crop, time step
      and standard; the reference evapotranspiration series of the stations,
      at the overpass time and as daily sums.
    contents:
      - ef_ref_net_radiation
      - ef_ref_soil_heat_flux
      - ef_ref_et
      - ef_station_ref_et
  - title: Spatial regionalization (GWR)
    desc: >
      Regionalization of meteorological station variables over the working
      grid: an orchestrator that projects the stations, extracts the
      covariates and predicts by blocks with terra, the comparison
      configurations (representative station, global regression, inverse
      distance weighting) and geographically weighted regression with one
      common interface, the numeric GWR core (plain vectors and matrices in a
      projected CRS, explicit kernel, bandwidth and criterion, auditable
      bandwidth profiles, extrapolation flags) and spatial block
      cross-validation.
  - subtitle: Regionalization
    desc: >
      One surface per variable and target time, with a flag word per cell,
      the fitted models, the station table and the provenance (including the
      execution plan).
    contents:
      - ef_regionalize
  - subtitle: Methods and control
    desc: >
      Configurations C1 (representative station), C2 (global regression,
      inverse distance weighting) and C3 (GWR), without defaults for the
      scientific choices, and the settings of the block prediction.
    contents:
      - ef_method_gwr
      - ef_method_station
      - ef_method_ols
      - ef_method_idw
      - ef_predict_control
  - subtitle: Fit and bandwidth selection
    contents:
      - ef_gwr_fit
      - ef_gwr_bandwidth
      - ef_gwr_search
  - subtitle: Prediction and diagnostics
    contents:
      - ef_gwr_predict
      - ef_gwr_diagnostics
  - subtitle: Validation
    desc: >
      Deterministic spatial block folds and out-of-fold predictions at the
      stations, with the same folds for every method.
    contents:
      - ef_spatial_folds
      - ef_regionalize_cv
  - title: Shared physical quantities
    desc: >
      Atmospheric and thermodynamic quantities used by several modules
      (radiation, sensible heat, evapotranspiration and reference ET).
    contents:
      - ef_air_pressure
      - ef_lambda
  - title: Datasets
    contents:
      - cauquenes_modis

# Reference index. Sections are added as functions are exported, to avoid
