url: https://djwillichile.github.io/EarthFlux/

template:
  bootstrap: 5
  bslib:
    primary: "#003B46"
    link-color: "#00606F"

authors:
  Guillermo Servando Fuentes-Jaque:
    href: https://github.com/djwillichile

articles:
  - title: Getting started
    contents:
      - earthflux-introduction
  - title: Development
    contents:
      - articles/design

reference:
  - title: METRIC
    desc: Physics core of the METRIC surface energy balance.
  - subtitle: Radiation components
    desc: >
      Solar geometry, shortwave transmissivity, incoming shortwave and
      longwave radiation and longwave radiation emitted by the surface: the
      inputs of the net radiation.
    contents:
      - ef_solar_geometry
      - ef_tau_sw
      - ef_rs_in
      - ef_atm_emissivity
      - ef_rl_in
      - ef_rl_out
  - subtitle: Net radiation
    contents:
      - ef_net_radiation
  - subtitle: Soil heat flux
    contents:
      - ef_g
  - subtitle: Anchor pixels
    contents:
      - ef_select_anchors
      - ef_anchors
      - ef_anchor_criteria
      - ef_anchor_rule
      - ef_homogeneity
      - ef_anchor_pick
      - ef_anchor_conditions
  - subtitle: Aerodynamics and sensible heat
    desc: >
      Momentum roughness, wind at the blending height, friction velocity,
      aerodynamic resistance, air density, dT calibration from the anchor
      pixels and sensible heat flux.
    contents:
      - ef_zom
      - ef_blending_wind
      - ef_ustar
      - ef_rah
      - ef_air_density
      - ef_ts_datum
      - ef_dt_coef
      - ef_sensible_heat
      - ef_h_control
      - ef_calibrate_h
  - subtitle: Latent heat and evapotranspiration
    contents:
      - ef_latent_heat
      - ef_et_inst
      - ef_etrf
      - ef_et_daily
  - title: Meteorological forcing
    desc: >
      Meteorological forcing of the METRIC chain from weather stations: the
      standard station table and its quality control, the variables derived
      from the observations and the reference evapotranspiration (grass ETo
      of FAO-56, alfalfa ETr of the ASCE-EWRI standardized equation).
  - subtitle: Station data and quality control
    desc: >
      Standard table of station metadata and observations (UTC timestamps,
      contract units, provenance) and its quality control, which flags
      records without modifying them.
    contents:
      - ef_station_table
      - ef_station_qc
  - subtitle: Derived variables
    desc: >
      Psychrometric constant, saturation and actual vapour pressure, dew
      point, wind speed at 2 m, extraterrestrial and clear-sky radiation
      (FAO-56).
    contents:
      - ef_psychrometric
      - ef_es
      - ef_es_slope
      - ef_ea
      - ef_dewpoint
      - ef_wind_2m
      - ef_ra_daily
      - ef_ra_period
      - ef_rso
  - subtitle: Reference evapotranspiration
    desc: >
      Net radiation and soil heat flux of the reference surface and the
      reference evapotranspiration, with explicit reference crop, time step
      and standard.
    contents:
      - ef_ref_net_radiation
      - ef_ref_soil_heat_flux
      - ef_ref_et
  - title: Shared physical quantities
    desc: >
      Atmospheric and thermodynamic quantities used by several modules
      (radiation, sensible heat, evapotranspiration and reference ET).
    contents:
      - ef_air_pressure
      - ef_lambda

# Reference index. Sections are added as functions are exported, to avoid
# empty documentation. Planned sections (in this order):
